server:
  port: 8080

spring:
  application:
    name: cpnRobotManagement

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/cpnrobot?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 1023MB
      max-request-size: 2GB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: pojos
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

onenet:
  token: ${ONENET_TOKEN:123456789}
  aes-key: ${ONENET_AES_KEY:your-onenet-aes-base64-key}

aliyun:
  oss:
    endpoint: "https://oss-cn-beijing.aliyuncs.com"
    bucketName: "lht-java-ai-edu"
    region: "cn-beijing"

zzulicloud:
  datasource:
    url: ${ZZULICLOUD_MYSQL_URL:jdbc:mysql://localhost:3307/zzulicloud?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${ZZULICLOUD_MYSQL_USERNAME:root}
    password: ${ZZULICLOUD_MYSQL_PASSWORD:admin123}
