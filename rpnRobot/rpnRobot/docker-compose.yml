services:
  # 1. 启动 MySQL 数据库容器
  mysql:
    image: mysql:8.0
    container_name: robot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 20250709
      MYSQL_DATABASE: cpnrobot  # 启动时自动创建 cpnrobot 数据库
    ports:
      - "3307:3306"
    volumes:
      # 挂载你项目里的 SQL 脚本。MySQL 容器首次启动时，会自动执行这个目录下的脚本！
      - ./database/cpnrobot.sql:/docker-entrypoint-initdb.d/1_cpnrobot.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 2. 启动你的 Spring Boot 后端容器
  backend:
    build: .
    container_name: robot-backend
    ports:
      - "8080:8080"
    environment:
      # 覆盖 application.yml 里的 url，把 localhost 改成 mysql 容器名（移除了 zzulicloud 配置）
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cpnrobot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    depends_on:
      - mysql  # 保证 MySQL 先启动