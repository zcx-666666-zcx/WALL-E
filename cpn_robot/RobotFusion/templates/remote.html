<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wall-E 遥控端</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; background: #111; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        
        /* 主视窗区 */
        .viewport { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
        
        /* 1. AI 模式下的显示内容 */
        #ai-status-box { text-align: center; color: #00ff88; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        #ai-icon { font-size: 80px; text-shadow: 0 0 20px rgba(0,255,136,0.5); }
        
        /* 2. 视频通话组件 */
        /* 对方画面 (大屏背景) */
        #remote-video { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; display: none; z-index: 10;
        }
        /* 自己画面 (右上角小窗) */
        #local-video {
            position: absolute; top: 20px; right: 20px; width: 120px; height: 160px;
            border: 2px solid rgba(255,255,255,0.5); border-radius: 8px;
            object-fit: cover; display: none; z-index: 20; background: #000;
        }

        /* 控制区 */
        .controls { height: 200px; background: rgba(30,30,30,0.9); display: flex; justify-content: space-around; align-items: center; padding: 10px; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 15px 30px; border: none; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; gap: 10px; align-items: center; }
        .btn-call { background: #00ff88; color: #000; }
        .btn-hangup { background: #ff3333; color: #fff; display: none; }
        #joystick-zone { width: 150px; height: 150px; background: rgba(255,255,255,0.05); border-radius: 50%; }
    </style>
</head>
<body>
    <div class="viewport">
        <div id="ai-status-box">
            <i id="ai-icon" class="fas fa-shield-alt"></i>
            <h2>系统安全守护中</h2>
            <p>AI 正在后台运行监控</p>
        </div>

        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button id="btn-call" class="btn btn-call" onclick="startCall()"><i class="fas fa-video"></i> 呼叫机器人</button>
            <button id="btn-hangup" class="btn btn-hangup" onclick="endCall()"><i class="fas fa-phone-slash"></i> 结束通话</button>
        </div>
        <div id="joystick-zone"></div>
    </div>

    <script>
        const socket = io();
        let localStream;
        let peerConnection;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        const els = {
            aiBox: document.getElementById('ai-status-box'),
            localVid: document.getElementById('local-video'),
            remoteVid: document.getElementById('remote-video'),
            btnCall: document.getElementById('btn-call'),
            btnHangup: document.getElementById('btn-hangup')
        };

        // --- Socket 逻辑 ---
        socket.on('status_update', (data) => {
            if (data.mode === 'AI') {
                els.aiBox.style.display = 'flex';
                els.localVid.style.display = 'none';
                els.remoteVid.style.display = 'none';
                els.btnCall.style.display = 'flex';
                els.btnHangup.style.display = 'none';
                closeCall();
            } else {
                els.aiBox.style.display = 'none';
                els.localVid.style.display = 'block';
                els.remoteVid.style.display = 'block';
                els.btnCall.style.display = 'none';
                els.btnHangup.style.display = 'flex';
            }
        });

        // 收到“视频就绪”信号 -> 发起 WebRTC
        socket.on('video_ready', async () => {
            console.log("WebRTC: 开始建立连接 (发起方)");
            await setupWebRTC();
            // 创建 Offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('webrtc_signal', { type: 'offer', sdp: offer });
        });

        // 信令处理
        socket.on('webrtc_signal', async (data) => {
            if (!peerConnection) return;
            if (data.type === 'answer') {
                await peerConnection.setRemoteDescription(data.sdp);
            } else if (data.type === 'candidate') {
                await peerConnection.addIceCandidate(data.candidate);
            }
        });

        // --- WebRTC 核心 ---
        async function setupWebRTC() {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            els.localVid.srcObject = localStream;

            peerConnection = new RTCPeerConnection(config);
            
            // 添加本地流
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            // 监听远端流 (树莓派的画面)
            peerConnection.ontrack = (event) => {
                els.remoteVid.srcObject = event.streams[0];
            };

            // ICE 候选
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc_signal', { type: 'candidate', candidate: event.candidate });
                }
            };
        }

        function closeCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            peerConnection = null;
        }

        // --- 控制 ---
        window.startCall = () => socket.emit('request_video_mode');
        window.endCall = () => socket.emit('request_ai_mode');

        // 摇杆
        const manager = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: {left: '50%', top: '50%'}, color: 'white' });
        manager.on('move', (evt, data) => {
            if (data.vector) socket.emit('control', { x: data.vector.x, y: data.vector.y });
        });
        manager.on('end', () => socket.emit('control', { x: 0, y: 0 }));
    </script>
</body>
</html>
