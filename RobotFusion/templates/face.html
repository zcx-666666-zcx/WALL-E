<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Wall-E Face</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; overflow: hidden; font-family: sans-serif; }
        #container { position: relative; width: 100vw; height: 100vh; }

        /* 待机层 */
        #standby-layer {
            width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
        }
        #clock { font-size: 120px; color: #00ff88; font-weight: bold; }

        /* 通话层 */
        #call-layer { display: none; width: 100%; height: 100%; }
        /* 对方画面 (大背景) */
        #remote-video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        /* 自己画面 (小窗) */
        #local-video {
            position: absolute; top: 20px; right: 20px; width: 240px; height: 180px;
            border: 2px solid white; border-radius: 10px; object-fit: cover; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="standby-layer">
            <div id="clock">00:00</div>
            <div style="margin-top:20px; color:#666;">Wall-E System Online</div>
        </div>
        <div id="call-layer">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream;
        let peerConnection;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        const els = {
            standby: document.getElementById('standby-layer'),
            call: document.getElementById('call-layer'),
            localVid: document.getElementById('local-video'),
            remoteVid: document.getElementById('remote-video'),
            clock: document.getElementById('clock')
        };

        // 时钟
        setInterval(() => {
            const now = new Date();
            els.clock.innerText = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
        }, 1000);

        socket.on('status_update', (data) => {
            if (data.mode === 'VIDEO') {
                els.standby.style.display = 'none';
                els.call.style.display = 'block';
                // 此时等待手机发起 Offer，这里只做 UI 切换和摄像头准备
                startCamera();
            } else {
                els.standby.style.display = 'flex';
                els.call.style.display = 'none';
                closeCall();
            }
        });

        // 信令监听
        socket.on('webrtc_signal', async (data) => {
            if (!localStream) await startCamera(); // 确保摄像头已打开
            if (!peerConnection) createPeerConnection();

            if (data.type === 'offer') {
                await peerConnection.setRemoteDescription(data.sdp);
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('webrtc_signal', { type: 'answer', sdp: answer });
            } else if (data.type === 'candidate') {
                await peerConnection.addIceCandidate(data.candidate);
            }
        });

        async function startCamera() {
            if (localStream) return;
            try {
                // 树莓派上这里会调用 USB 摄像头
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                els.localVid.srcObject = localStream;
            } catch (e) { console.error("摄像头启动失败:", e); }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(config);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            
            peerConnection.ontrack = (event) => {
                els.remoteVid.srcObject = event.streams[0];
            };
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) socket.emit('webrtc_signal', { type: 'candidate', candidate: event.candidate });
            };
        }

        function closeCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            localStream = null;
            peerConnection = null;
        }
    </script>
</body>
</html>
